server:
  port: 8084

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5435/auth_db
    username: auth_user
    password: auth_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.security: DEBUG
# Chave usada para ASSINAR e VALIDAR o JWT. Precisa ser a mesma chave
# (ou par de chaves, se usarmos algoritmo assimétrico) que os outros
# serviços vão usar para validar o token - isso é configurado na Fase 4
# também nos demais serviços.
jwt:
  secret: ${JWT_SECRET:uma-chave-bem-longa-e-secreta-trocar-em-producao-0123456789}
  expiration-ms: 3600000

# application.yml do auth-service
admin:
  default-password: ${ADMIN_DEFAULT_PASSWORD:changeme123}