<div class="page-header">
  <h1>Produtos</h1>
  <button mat-flat-button color="primary" routerLink="new">
    <mat-icon>add</mat-icon>
    Novo Produto
  </button>
</div>

<mat-form-field appearance="outline" class="search-field">
  <mat-label>Buscar por nome</mat-label>
  <input
    matInput
    [(ngModel)]="searchTerm"
    (keyup.enter)="search()"
    placeholder="Digite o nome e pressione Enter"
  />
  <button matSuffix mat-icon-button (click)="search()">
    <mat-icon>search</mat-icon>
  </button>
</mat-form-field>

@if (loading()) {
  <div class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
} @else {
  <table mat-table [dataSource]="products()" class="mat-elevation-z1 full-width">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let product">{{ product.name }}</td>
    </ng-container>

    <ng-container matColumnDef="sku">
      <th mat-header-cell *matHeaderCellDef>SKU</th>
      <td mat-cell *matCellDef="let product">{{ product.sku }}</td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Preço</th>
      <td mat-cell *matCellDef="let product">{{ product.price | currency: 'BRL' }}</td>
    </ng-container>

    <ng-container matColumnDef="stockQuantity">
      <th mat-header-cell *matHeaderCellDef>Estoque</th>
      <td mat-cell *matCellDef="let product">{{ product.stockQuantity }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let product">
        <button mat-icon-button [routerLink]="[product.id, 'edit']" title="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="remove(product)" title="Excluir">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (products().length === 0) {
    <p class="empty-state">Nenhum produto encontrado.</p>
  }
}
