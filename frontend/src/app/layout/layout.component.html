<mat-sidenav-container class="shell">
  <mat-sidenav
    #drawer
    class="rail"
    [mode]="sidenavMode()"
    [opened]="!isNarrow()"
    [fixedInViewport]="true"
  >
    <a class="brand" routerLink="/" (click)="isNarrow() && drawer.close()" aria-label="AtlasTT, ir para o painel">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-name">AtlasTT</span>
        <span class="brand-sub">Distribuidora</span>
      </span>
    </a>

    <nav class="rail-nav" aria-label="Principal">
      @for (item of navItems; track item.path) {
        <a
          class="rail-link"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          (click)="isNarrow() && drawer.close()"
        >
          <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="rail-user">
      <div class="user-text">
        <span class="user-name">{{ authService.getUsername() }}</span>
        <span class="user-role">{{ roleLabel() }}</span>
      </div>
      <button type="button" class="logout" (click)="logout()" title="Sair" aria-label="Sair da conta">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    @if (isNarrow()) {
      <header class="topbar">
        <button type="button" class="menu-btn" (click)="drawer.toggle()" aria-label="Abrir menu">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="topbar-title">AtlasTT</span>
      </header>
    }
    <main class="page-wrap">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
