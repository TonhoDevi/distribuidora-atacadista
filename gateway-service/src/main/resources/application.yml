server:
  port: 48080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:44200"
                # Necessário para o navegador enviar/receber o cookie HttpOnly em chamadas cross-origin
                # (44200 -> 48080). Com credenciais, a origem tem que ser explícita (nunca "*").
                allowCredentials: true
                allowedMethods: "*"
                allowedHeaders: "*"
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/customers/**

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/products/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/orders/**

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**,/users/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:48761/eureka

jwt:
  cookie-name: auth_token
  secret: ${JWT_SECRET:uma-chave-bem-longa-e-secreta-trocar-em-producao-0123456789}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}
