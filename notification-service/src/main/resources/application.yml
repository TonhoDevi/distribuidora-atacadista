server:
  port: 48085

spring:
  application:
    name: notification-service

  rabbitmq:
    host: localhost
    port: 56720
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:48761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}
